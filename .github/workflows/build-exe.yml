name: Build Executavel Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo fonte
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar Executavel Windows (.exe unico) com PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "RoboIndicacaoSalesforceC6" --collect-all playwright --hidden-import config --hidden-import db --hidden-import license --hidden-import main --hidden-import rpa --hidden-import sheets gui.py

      - name: Publicar Executavel como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: RoboIndicacaoSalesforceC6-Windows-Exe
          path: dist/RoboIndicacaoSalesforceC6.exe

      - name: Atualizar Release Publica
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0-client
          name: "Versao 2.0 (Executavel Windows - Salesforce C6)"
          files: dist/RoboIndicacaoSalesforceC6.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
