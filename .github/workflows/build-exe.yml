name: Build Executavel Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo fonte
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Gerar Executavel Windows (.exe unico) com PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "RoboIndicacaoLeadSale" --collect-all playwright --hidden-import config --hidden-import db --hidden-import license --hidden-import main --hidden-import rpa --hidden-import sheets gui.py

      - name: Publicar Executavel como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: RoboIndicacaoLeadSale-Windows-Exe
          path: dist/RoboIndicacaoLeadSale.exe
